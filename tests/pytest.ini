[pytest]
; -ra prints the reason for every skip in the summary -- the harness contract
; is "skip cleanly with a printed reason", so keep it.
addopts = -ra
markers =
    robot: needs the physical Reachy Mini on USB (skips unless /dev/ttyACM* exists)
    models: loads or downloads big local models via voice/.venv (skips unless that venv exists)
    anthropic: needs ANTHROPIC_API_KEY (environment or voice/.env)
    google: needs GOOGLE_API_KEY (environment or voice/.env)
    audio: needs a usable sound card (skips unless /dev/snd is accessible)
